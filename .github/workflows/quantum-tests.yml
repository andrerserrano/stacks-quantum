name: Quantum demo verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node mainnet/verify-snapshot.mjs
      - run: npm ci --prefix vault
      - run: npm ci --prefix mainnet/snapshot/source/vault
      - name: Original prototype tests
        run: npm test --prefix vault
      - name: Frozen candidate and audit tests (no wallet or live network)
        run: node --test mainnet/snapshot/mainnet/*.test.mjs mainnet/test/*.test.mjs
